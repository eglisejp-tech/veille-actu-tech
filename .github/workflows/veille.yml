name: Veille quotidienne

on:
  schedule:
    # 3 h 17 UTC : GitHub décale souvent les tâches planifiées de plusieurs heures, surtout à l'heure pile.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Jeton GitHub (fine-grained, Contents: Read and write sur Stouph1/netbudget).
      # Absent : la publication sur netbudget.app/ejp-tech-actu est simplement sautée.
      NETBUDGET_TOKEN: ${{ secrets.NETBUDGET_TOKEN }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Lancer la pipeline de veille
        run: python3 veille_rss.py

      - name: Commit des nouveaux articles
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv veille.json seen.json docs/veille.json
          if git diff --cached --quiet; then
            echo "Aucun nouvel article"
          else
            git commit -m "Veille du $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Récupérer le site netbudget.app
        if: env.NETBUDGET_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Stouph1/netbudget
          ref: main
          token: ${{ secrets.NETBUDGET_TOKEN }}
          path: netbudget

      - name: Publier sur netbudget.app/ejp-tech-actu
        if: env.NETBUDGET_TOKEN != ''
        run: |
          python3 scripts/publier_netbudget.py netbudget/website/public
          cd netbudget
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add website/public/ejp-tech-actu
          if git diff --cached --quiet; then
            echo "Site netbudget déjà à jour"
          else
            git commit -m "ejp-tech-actu : veille du $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
